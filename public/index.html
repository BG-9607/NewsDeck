<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Newsdeck — live headlines</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📰</text></svg>">
</head>
<body>
<div class="app">
  <div class="backdrop" id="backdrop" hidden></div>

  <aside class="sidebar" id="sidebar" aria-label="Categories menu">
    <div class="brand">
      <span class="brand-mark">📰</span>
      <div>
        <h1>Newsdeck</h1>
        <p class="brand-sub">Live headlines</p>
      </div>
    </div>

    <nav class="cats" id="cats" aria-label="Categories"></nav>

    <div class="sidebar-foot">
      <div class="live" id="live">
        <span class="dot" id="liveDot"></span>
        <span id="liveText">Connecting…</span>
      </div>
      <button class="ghost" id="sourcesBtn" type="button" aria-expanded="false">Source health</button>
      <div class="sources" id="sources" hidden></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" type="button"
              aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">☰</button>
      <div class="search">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="search" type="search" placeholder="Filter headlines…  (press /)" autocomplete="off" spellcheck="false">
        <button class="clear" id="clearSearch" type="button" hidden aria-label="Clear search">×</button>
      </div>
      <div class="topbar-actions">
        <span class="live live-mini" id="liveMini" title="Connecting…"><span class="dot"></span></span>
        <span class="updated" id="updated"></span>
        <button class="icon-btn" id="refreshBtn" type="button" title="Refresh now (r)" aria-label="Refresh now">⟳</button>
        <button class="icon-btn" id="themeBtn" type="button" title="Toggle theme (t)" aria-label="Toggle theme">◑</button>
      </div>
    </header>

    <div class="newbar" id="newbar" hidden>
      <button id="newbarBtn" type="button"><span id="newCount">0</span> new stories — show</button>
    </div>

    <section class="feed" id="feed" aria-live="polite" aria-busy="true"></section>
    <div class="empty" id="empty" hidden></div>
  </main>

  <div class="reader-backdrop" id="readerBackdrop" hidden>
    <div class="reader-modal" id="readerModal" role="dialog" aria-modal="true" aria-labelledby="readerTitle" tabindex="-1">
      <div class="reader-header">
        <div class="reader-nav-btns">
          <button class="icon-btn" id="readerPrevBtn" type="button" title="Previous story (← or j)" aria-label="Previous story">‹</button>
          <button class="icon-btn" id="readerNextBtn" type="button" title="Next story (→ or k)" aria-label="Next story">›</button>
          <span class="reader-pos" id="readerPos"></span>
        </div>
        <div class="reader-actions">
          <button class="icon-btn" id="readerCopyBtn" type="button" title="Copy article link" aria-label="Copy article link">📋</button>
          <a class="icon-btn reader-ext-btn" id="readerExtBtn" href="#" target="_blank" rel="noopener noreferrer" title="Open source in new tab" aria-label="Open source in new tab">↗</a>
          <button class="icon-btn reader-close-btn" id="readerCloseBtn" type="button" title="Close reader (Esc)" aria-label="Close reader">✕</button>
        </div>
      </div>

      <article class="reader-content" id="readerContent">
        <div class="reader-hero" id="readerHero" hidden>
          <img class="reader-img" id="readerImg" alt="" />
        </div>
        <div class="reader-body">
          <div class="reader-meta">
            <span class="badge" id="readerSource"></span>
            <span class="time" id="readerTime"></span>
            <span class="reader-author" id="readerAuthor"></span>
            <span class="reader-readtime" id="readerReadTime"></span>
          </div>
          <h1 class="reader-title" id="readerTitle"></h1>
          <div class="reader-also" id="readerAlso" hidden>
            <span class="reader-also-label">Also covered by:</span>
            <div class="reader-also-tags" id="readerAlsoTags"></div>
          </div>
          <div class="reader-summary" id="readerSummary"></div>
          
          <div class="reader-footer">
            <a class="reader-primary-btn" id="readerPrimaryLink" href="#" target="_blank" rel="noopener noreferrer">
              <span>Read full coverage on <strong id="readerPrimarySource">source</strong></span>
              <span class="arrow-icon">↗</span>
            </a>
          </div>
        </div>
      </article>
    </div>
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>
